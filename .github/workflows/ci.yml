name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests (Chrome headless)
        run: npm run test:ci
      - run: npm audit --audit-level=high
