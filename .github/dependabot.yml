# Weekly dependency updates, grouped so each ecosystem opens at most one PR.
# PRs target `staging`; `main` is only updated by the owner.
version: 2
updates:

  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Angular majors need `ng update` and its migrations.
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
