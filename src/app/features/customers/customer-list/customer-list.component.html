<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Customers</h2>
    <div>
      <a routerLink="/customers/new" class="btn btn-primary">
        Add Customer
      </a>
      <a routerLink="/imports/upload" class="btn btn-primary m-3">
        Upload CSV
      </a>
      <a routerLink="/logout" class="btn btn-danger">
        Logout
      </a>
    </div>

  </div>

  <div *ngIf="error" class="alert alert-danger alert-dismissible fade show" role="alert">
    {{ error }}
    <button type="button" class="btn-close" (click)="error = ''"></button>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!loading && customers.length === 0" class="alert alert-info">
    No customers found. Start by adding a new customer.
  </div>

  <div *ngIf="!loading && customers.length > 0" class="card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Full Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Document</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let customer of customers">
              <td>{{ customer.full_name }}</td>
              <td>{{ customer.email }}</td>
              <td>{{ customer.phone || '-' }}</td>
              <td>{{ customer.document }}</td>
              <td class="text-end table-actions">
                <button
                  class="btn btn-sm btn-outline-primary me-2"
                  (click)="editCustomer(customer.id)"
                >
                  Edit
                </button>
                <button
                  *ngIf="deleteConfirm !== customer.id"
                  class="btn btn-sm btn-outline-danger"
                  (click)="confirmDelete(customer.id)"
                >
                  Delete
                </button>
                <div *ngIf="deleteConfirm === customer.id" class="d-inline">
                  <button
                    class="btn btn-sm btn-danger me-1"
                    (click)="deleteCustomer(customer.id)"
                  >
                    Confirm
                  </button>
                  <button
                    class="btn btn-sm btn-secondary"
                    (click)="cancelDelete()"
                  >
                    Cancel
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
